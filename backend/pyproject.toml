[project]
name = "medmdt"
version = "0.1.0"
description = "Multi-expert medical consultation agent system"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.7",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "neo4j>=5.0",
    "pymilvus>=2.4",
    "elasticsearch>=8.0",
    "requests>=2.31",
    "pillow>=10.0",
    "pydicom>=2.4",
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "py7zr>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medmdt"]
